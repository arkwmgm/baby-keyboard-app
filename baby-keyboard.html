<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>赤ちゃんキーボードあそび</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body { font-family:'Hiragino Maru Gothic Pro','BIZ UDPGothic',sans-serif; width:100vw; height:100vh; overflow:hidden; cursor:none; }

/* ===== モード選択 ===== */
#mode-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%; height:100%; overflow:hidden;
  background:linear-gradient(160deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  position:relative;
}

/* 背景の星 */
#mode-screen::before {
  content:'';
  position:absolute; inset:0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 25% 60%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(3px 3px at 40% 10%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 55% 80%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(3px 3px at 80% 70%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(2px 2px at 90% 15%, rgba(255,255,255,.6) 0%, transparent 100%),
    radial-gradient(2px 2px at 15% 85%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(2px 2px at 60% 45%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(3px 3px at 35% 75%, rgba(255,255,255,.4) 0%, transparent 100%);
  pointer-events:none;
}

/* ヘッダーエリア */
#mode-header {
  position:relative; z-index:1;
  text-align:center; margin-bottom:clamp(.8rem,2vh,1.6rem);
}
#mode-header h1 {
  font-size:clamp(1.4rem,3.5vw,2.4rem); color:white;
  font-weight:900; letter-spacing:.06em;
  text-shadow:0 0 30px rgba(160,120,255,.8), 0 4px 12px rgba(0,0,0,.5);
  animation:glow-title 3s ease-in-out infinite;
}
#mode-header p {
  font-size:clamp(.65rem,1.4vw,.9rem);
  color:rgba(200,180,255,.7); margin-top:.3rem; letter-spacing:.1em;
}
@keyframes glow-title {
  0%,100%{ text-shadow:0 0 20px rgba(160,120,255,.6), 0 4px 12px rgba(0,0,0,.5); }
  50%    { text-shadow:0 0 40px rgba(200,160,255,.9), 0 4px 12px rgba(0,0,0,.5); }
}

/* グリッド */
#mode-grid {
  position:relative; z-index:1;
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:clamp(.6rem,1.2vw,1rem);
  padding:.5rem clamp(.5rem,2vw,1.5rem);
  max-width:1000px; width:96%;
}

/* カード */
.mode-btn {
  border:none; border-radius:22px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.5rem;
  width:clamp(110px,12.5vw,160px);
  padding:clamp(.8rem,1.8vh,1.3rem) .8rem;
  position:relative; overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2);
}
.mode-btn::before {
  content:''; position:absolute; inset:0;
  background:rgba(255,255,255,.08);
  border-radius:22px;
  opacity:0; transition:opacity .2s;
}
.mode-btn:hover { transform:translateY(-6px) scale(1.05); box-shadow:0 18px 40px rgba(0,0,0,.5); }
.mode-btn:hover::before { opacity:1; }
.mode-btn:active { transform:scale(.95); }

/* カード個別カラー */
.mode-btn[data-mode="animals"]  { background:linear-gradient(145deg,#56ab2f,#a8e063); }
.mode-btn[data-mode="shapes"]   { background:linear-gradient(145deg,#f7971e,#ffd200); }
.mode-btn[data-mode="flowers"]  { background:linear-gradient(145deg,#ee0979,#ff6a00); }
.mode-btn[data-mode="vehicles"] { background:linear-gradient(145deg,#1a78c2,#56ccf2); }
.mode-btn[data-mode="sea"]      { background:linear-gradient(145deg,#0052d4,#4364f7,#6fb1fc); }
.mode-btn[data-mode="dogs"]     { background:linear-gradient(145deg,#c94b4b,#4b134f); }
.mode-btn[data-mode="food"]     { background:linear-gradient(145deg,#f09819,#edde5d); }

/* カード内容 */
.mode-btn .icon-wrap {
  width:clamp(52px,6vw,72px); height:clamp(52px,6vw,72px);
  border-radius:50%;
  background:rgba(255,255,255,.22);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.5rem,3vw,2.2rem);
  box-shadow:0 4px 12px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s;
}
.mode-btn:hover .icon-wrap { transform:scale(1.12) rotate(-5deg); }
.mode-btn .label {
  font-size:clamp(.65rem,1.2vw,.9rem); font-weight:800;
  color:white; letter-spacing:.04em;
  text-shadow:0 2px 6px rgba(0,0,0,.35);
  white-space:nowrap;
}

/* ===== 遊び画面 ===== */
#play-screen { display:none; position:relative; width:100%; height:100%; overflow:hidden; }
#play-bg { position:absolute; inset:0; transition:background 0.8s; }
/* 背景レイヤー（道路・波など） */
#bg-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
#play-canvas { position:absolute; inset:0; pointer-events:none; }
#mode-label {
  position:fixed; top:10px; left:50%; transform:translateX(-50%);
  font-size:1rem; color:rgba(255,255,255,.45); pointer-events:none; z-index:999;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
}
#hint { position:fixed; bottom:6px; right:10px; font-size:.55rem; color:rgba(255,255,255,.15); pointer-events:none; z-index:1000; }

/* ===== 全画面ボタン ===== */
#fullscreen-btn {
  position:fixed; top:12px; right:14px; z-index:1001;
  background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.4);
  color:white; border-radius:10px; padding:.4rem .7rem;
  font-size:1.3rem; cursor:pointer; backdrop-filter:blur(4px);
  transition:background .2s, transform .15s;
  line-height:1;
}
#fullscreen-btn:hover{background:rgba(255,255,255,.35);transform:scale(1.1)}

/* ===== ESC カウンター表示 ===== */
#esc-indicator {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  display:none; gap:6px; z-index:1001;
}
#esc-indicator.show{display:flex}
#esc-indicator span {
  width:14px; height:14px; border-radius:50%;
  background:rgba(255,255,255,.3); border:2px solid rgba(255,255,255,.6);
  transition:background .15s;
}
#esc-indicator span.filled{background:rgba(255,255,255,.9)}

/* ===== 終了確認 ===== */
#exit-confirm {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:2000; align-items:center; justify-content:center;
}
#exit-confirm.show{display:flex}
#exit-confirm .box {
  background:white; border-radius:24px; padding:2.5rem 3rem;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#exit-confirm h2{font-size:1.8rem;margin-bottom:.8rem;color:#333}
#exit-confirm p{color:#666;margin-bottom:1.5rem}
.confirm-btns{display:flex;gap:1rem;justify-content:center}
.btn-yes,.btn-no{padding:.8rem 2rem;font-size:1.1rem;border:none;border-radius:12px;cursor:pointer;font-weight:bold;transition:transform .1s}
.btn-yes{background:#e74c3c;color:white}
.btn-no{background:#2ecc71;color:white}
.btn-yes:hover,.btn-no:hover{transform:scale(1.05)}
.btn-yes kbd,.btn-no kbd{
  display:inline-block; font-size:.75em; font-family:monospace;
  background:rgba(255,255,255,.25); border-radius:5px;
  padding:.05em .35em; margin-left:.3em; border:1px solid rgba(255,255,255,.4);
  vertical-align:middle; line-height:1.4;
}

/* 乗り物：右から左へ画面を横断 */
@keyframes drive-thru {
  0%   { transform: translateX(115vw); }
  100% { transform: translateX(-130vw); }
}
/* 花：咲いて閉じる */
@keyframes bloom {
  0%  { transform: scale(0) rotate(-30deg); opacity:0; }
  30% { transform: scale(1.2) rotate(5deg);  opacity:1; }
  60% { transform: scale(1.0) rotate(0deg);  opacity:1; }
  85% { transform: scale(1.1) rotate(3deg);  opacity:1; }
  100%{ transform: scale(0)   rotate(20deg); opacity:0; }
}
/* 食べ物：かじられる */
@keyframes chomp {
  0%  { transform:scale(1);   opacity:1; }
  20% { transform:scale(1.3); opacity:1; }
  40% { transform:scale(.85) rotate(-8deg); }
  55% { transform:scale(.65) rotate(5deg); }
  70% { transform:scale(.4)  rotate(-5deg); }
  85% { transform:scale(.2); opacity:.5; }
  100%{ transform:scale(0);  opacity:0; }
}
/* 水生物：ゆらゆら浮かぶ */
@keyframes float-bubble {
  0%  { transform:translateY(0)   scale(1)   rotate(0deg);  opacity:1; }
  30% { transform:translateY(-60px) scale(1.1) rotate(8deg); }
  60% { transform:translateY(-120px) scale(.95) rotate(-6deg); }
  85% { transform:translateY(-200px) scale(.8); opacity:.6; }
  100%{ transform:translateY(-280px) scale(.5); opacity:0; }
}
/* 動物：ぴょんぴょん */
@keyframes animal-jump {
  0%  { transform:translateY(0) scale(1);    opacity:1; }
  25% { transform:translateY(-80px) scale(1.15); }
  50% { transform:translateY(-20px) scale(.95); }
  70% { transform:translateY(-60px) scale(1.1); }
  85% { transform:translateY(-10px) scale(.9); opacity:1; }
  100%{ transform:translateY(0) scale(.3);   opacity:0; }
}
/* 犬：しっぽフリフリ */
@keyframes dog-wag {
  0%  { transform:scale(1)    rotate(0deg);   opacity:1; }
  15% { transform:scale(1.2)  rotate(-12deg); }
  30% { transform:scale(1.15) rotate(12deg);  }
  45% { transform:scale(1.2)  rotate(-10deg); }
  60% { transform:scale(1.1)  rotate(8deg);   }
  75% { transform:scale(.9)   rotate(-5deg);  opacity:.8; }
  100%{ transform:scale(0)    rotate(20deg);  opacity:0; }
}
/* 形・色：爆発 */
@keyframes shape-burst {
  0%  { transform:scale(0) rotate(0deg);   opacity:1; }
  40% { transform:scale(1.4) rotate(180deg); }
  70% { transform:scale(1.1) rotate(300deg); opacity:1; }
  100%{ transform:scale(0) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<!-- モード選択 -->
<div id="mode-screen">
  <div id="mode-header">
    <h1>🎹 なにであそぶ？</h1>
    <p>すきなモードをえらんでね</p>
  </div>
  <div id="mode-grid">
    <button class="mode-btn" data-mode="animals">
      <div class="icon-wrap">🐱</div><span class="label">どうぶつ</span>
    </button>
    <button class="mode-btn" data-mode="shapes">
      <div class="icon-wrap">⭐</div><span class="label">いろ・かたち</span>
    </button>
    <button class="mode-btn" data-mode="flowers">
      <div class="icon-wrap">🌸</div><span class="label">おはな</span>
    </button>
    <button class="mode-btn" data-mode="vehicles">
      <div class="icon-wrap">🚗</div><span class="label">のりもの</span>
    </button>
    <button class="mode-btn" data-mode="sea">
      <div class="icon-wrap">🐠</div><span class="label">うみのいきもの</span>
    </button>
    <button class="mode-btn" data-mode="dogs">
      <div class="icon-wrap">🐕</div><span class="label">わんこ</span>
    </button>
    <button class="mode-btn" data-mode="food">
      <div class="icon-wrap">🍎</div><span class="label">たべもの</span>
    </button>
  </div>
</div>

<!-- 全画面ボタン（常時表示） -->
<button id="fullscreen-btn" title="全画面">⛶</button>

<!-- 遊び画面 -->
<div id="play-screen">
  <div id="play-bg"></div>
  <div id="bg-layer"></div>
  <canvas id="play-canvas"></canvas>
  <div id="mode-label"></div>
</div>

<!-- ESC カウンター dots -->
<div id="esc-indicator">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div id="exit-confirm">
  <div class="box">
    <h2>🔓 もどりますか？</h2>
    <p>モードえらびがめんにもどります</p>
    <div class="confirm-btns">

      <button class="btn-no"  id="btn-no">つづける <kbd>N</kbd></button>
    </div>
  </div>
</div>
<div id="hint">ESC×5 → もどる</div>

// =====================================================================
// 音声合成
// =====================================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

// 汎用ユーティリティ
function makeOsc(freq, type='sine', start=0, dur=0.3, gainVal=0.3) {
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
  g.gain.setValueAtTime(gainVal, audioCtx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  osc.start(audioCtx.currentTime + start);
  osc.stop(audioCtx.currentTime + start + dur + 0.05);
  return {osc, g};
}
function makeNoise(dur=0.15, gainVal=0.2, start=0) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  src.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(gainVal, audioCtx.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  src.start(audioCtx.currentTime + start);
  return src;
}

// モード別サウンド
const SOUNDS = {
  animals: () => {
    // ランダムに動物鳴き声を選ぶ
    const r = Math.random();
    if (r < .2) {
      // 猫：にゃー（周波数グライド下降）
      const {osc} = makeOsc(800,'sine',0,.4,.25);
      osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime+.35);
    } else if (r < .4) {
      // 犬：ワン（短いノイズ+倍音）
      makeNoise(.06,.3,0); makeNoise(.06,.2,.07); makeNoise(.05,.15,.13);
      makeOsc(220,'square',0,.15,.1);
    } else if (r < .6) {
      // カエル：ゲコ（矩形波 down）
      const {osc} = makeOsc(300,'square',0,.2,.2);
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime+.18);
    } else if (r < .8) {
      // 鳥：ピイピイ（高い sine 2回）
      makeOsc(1200,'sine',0,.12,.2);
      makeOsc(1400,'sine',.15,.12,.2);
    } else {
      // ライオン：ガォー（低いノイズ+オシレータ）
      makeNoise(.3,.35,0);
      makeOsc(80,'sawtooth',0,.35,.15);
    }
  },
  shapes: () => {
    const notes = [523,659,784,1047,1319];
    const n = notes[Math.floor(Math.random()*notes.length)];
    makeOsc(n,'triangle',0,.3,.25);
    makeOsc(n*1.5,'sine',0,.25,.15);
    if(Math.random()<.4) makeOsc(n*2,'sine',.1,.2,.1);
  },
  flowers: () => {
    // 柔らかいチャイム
    const base = [523,659,784,1047][Math.floor(Math.random()*4)];
    makeOsc(base,'sine',0,.5,.2);
    makeOsc(base*1.25,'sine',.1,.45,.12);
    makeOsc(base*1.5,'sine',.2,.4,.08);
    makeOsc(base*2,'sine',.3,.3,.05);
  },
  vehicles: () => {
    const r = Math.random();
    if (r < .25) {
      // サイレン（交互に高低）
      const {osc} = makeOsc(880,'sawtooth',0,.6,.25);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(660, audioCtx.currentTime+.3);
      osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime+.6);
    } else if (r < .5) {
      // エンジン音（低いノイズ＋サブ）
      makeNoise(.5,.25,0);
      makeOsc(60,'sawtooth',0,.5,.2);
      makeOsc(120,'square',0,.5,.1);
    } else if (r < .75) {
      // 踏切：カンカン
      makeOsc(1200,'square',0,.08,.3);
      makeOsc(1200,'square',.12,.08,.3);
      makeOsc(1200,'square',.24,.08,.3);
      makeOsc(1200,'square',.36,.08,.3);
    } else {
      // 飛行機：ジェット音上昇
      const {osc} = makeOsc(100,'sawtooth',0,.5,.3);
      osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime+.45);
      makeNoise(.5,.15,0);
    }
  },
  sea: () => {
    const r = Math.random();
    if (r < .35) {
      // 水しぶき
      makeNoise(.15,.35,0);
      makeNoise(.1,.2,.08);
      makeOsc(800,'sine',0,.15,.1);
      makeOsc(600,'sine',.05,.12,.08);
    } else if (r < .65) {
      // ポタポタ水滴
      [0,.15,.32,.5].forEach(t => {
        makeNoise(.05,.25,t);
        makeOsc(600+Math.random()*300,'sine',t,.1,.12);
      });
    } else {
      // 泡：ブクブク
      for(let i=0;i<6;i++) {
        const t = i*.07;
        makeOsc(400+i*80,'sine',t,.06,.15);
        makeNoise(.04,.1,t);
      }
    }
  },
  dogs: () => {
    const r = Math.random();
    if (r < .5) {
      // ワン！
      makeNoise(.04,.4,0); makeNoise(.04,.3,.05); makeNoise(.04,.2,.1);
      makeOsc(200,'square',0,.2,.15);
      makeOsc(250,'square',.02,.18,.1);
    } else {
      // クゥーン（高いグライド）
      const {osc} = makeOsc(600,'sine',0,.4,.2);
      osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime+.35);
    }
  },
  food: () => {
    // むしゃむしゃ（リズミカルなノイズ+低音）
    const bites = 3 + Math.floor(Math.random()*3);
    for(let i=0;i<bites;i++) {
      const t = i*.12;
      makeNoise(.07,.45,t);
      makeOsc(180,'square',t,.07,.2);
      makeOsc(220,'sawtooth',t+.02,.05,.15);

    // 飲み込む音
    makeNoise(.1,.2,bites*.12+.05);
    makeOsc(100,'sine',bites*.12+.05,.15,.1);
  }
};

let currentMode = null;

// =====================================================================
// 絵文字スポーン
// =====================================================================
function spawnEmoji(px, py) {
  if (!currentMode) return;
  const mode = MODES[currentMode];
  const count = mode.multi[0] + Math.floor(Math.random()*(mode.multi[1]-mode.multi[0]+1));
  for (let i=0; i<count; i++) {
    setTimeout(() => {
      if (!currentMode) return;
      const emoji = mode.emojis[Math.floor(Math.random()*mode.emojis.length)];
      const size  = mode.size[0] + Math.random()*(mode.size[1]-mode.size[0]);
      const anim  = mode.animation;

      let x, y, dur, timing;

      if (anim === 'drive-thru') {
        // 乗り物：画面右端から登場、高さはランダムだが道路エリア寄り
        x   = 0; // translateX で動かすので left=0 固定
        y   = window.innerHeight * (0.3 + Math.random() * 0.45);
        dur = 2200 + Math.random() * 1200; // 2.2〜3.4 秒
        timing = 'linear';
      } else {
        const dr = mode.duration;
        x = 60 + Math.random()*(window.innerWidth-120);
        y = 60 + Math.random()*(window.innerHeight-160);
        dur = (dr[0] + Math.random()*(dr[1]-dr[0])) * 1000;
        timing = 'ease';
      }

      const el = document.createElement('div');
      el.style.cssText = `
        position:absolute; left:${x}px; top:${y}px;
        font-size:${size}px; line-height:1;
        pointer-events:none; z-index:10;
        transform-origin: center center;
        animation: ${anim} ${dur}ms ${timing} forwards;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));
      `;
      el.textContent = emoji;
      document.getElementById('play-screen').appendChild(el);
      setTimeout(() => el.remove(), dur + 100);
    }, i * 80);
  }

  // 音
  if (SOUNDS[currentMode]) {
    try { SOUNDS[currentMode](); } catch(e){}
  }
}

// =====================================================================
// モード開始
// =====================================================================
function startMode(modeName) {
  initAudio();
  currentMode = modeName;
  const mode = MODES[modeName];

  // 背景をランダム選択（前回と違うものを優先）
  const prev = bgIndex[modeName] ?? -1;
  let next;
  do { next = Math.floor(Math.random()*mode.bgs.length); } while(next===prev && mode.bgs.length>1);
  bgIndex[modeName] = next;
  const bg = mode.bgs[next];

  document.getElementById('mode-screen').style.display='none';
  const ps = document.getElementById('play-screen');
  ps.style.display='block';
  document.getElementById('play-bg').style.background = bg.grad;
  document.getElementById('mode-label').textContent = mode.name;

  // 背景レイヤー
  const bl = document.getElementById('bg-layer');
  bl.innerHTML = BG_LAYERS[bg.layer] || '';

  // 入場デモ
  setTimeout(()=>{
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        spawnEmoji(
          80+Math.random()*(window.innerWidth-160),
          80+Math.random()*(window.innerHeight-160)
        );
      }, i*120);
    }
  }, 200);
}

// =====================================================================
// 全画面 + Keyboard Lock
// =====================================================================
async function enterFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen)            await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    await el.mozRequestFullScreen();
  } catch(e) {}

  // Keyboard Lock API：ESC・fn などをブラウザが横取りしないようにロック
  // （Chrome 68+、全画面中のみ有効）
  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape',
        'MetaLeft','MetaRight',         // Windowsキー / Commandキー
        'F1','F2','F3','F4','F5',
        'F6','F7','F8','F9','F10','F11','F12',
      ]);
    } catch(e) {}
  }
}

function exitFullscreen() {
  // キーロック解除
  if (navigator.keyboard && navigator.keyboard.unlock) {
    try { navigator.keyboard.unlock(); } catch(e) {}
  }
  if (document.exitFullscreen)            document.exitFullscreen().catch(()=>{});
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement
          || document.mozFullScreenElement || document.msFullscreenElement);
}
function updateFullscreenBtn() {
  document.getElementById('fullscreen-btn').textContent = isFullscreen() ? '⊠' : '⛶';
}
document.addEventListener('fullscreenchange',       updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

document.getElementById('fullscreen-btn').addEventListener('click', () => {
  if (isFullscreen()) exitFullscreen(); else enterFullscreen();
});

// =====================================================================
// fn キー対策：フォーカス奪われたら即座に取り戻す
// =====================================================================
document.addEventListener('visibilitychange', () => {
  if (!currentMode) return;
  if (document.visibilityState === 'hidden') return;
  // ページが再表示されたらフォーカスを戻す
  setTimeout(() => document.body.focus(), 50);
});
window.addEventListener('blur', () => {
  if (!currentMode) return;
  // フォーカスが外れたら 100ms 後に戻す
  setTimeout(() => { try { window.focus(); document.body.focus(); } catch(e){} }, 100);
});
// body をフォーカス可能にする
document.body.setAttribute('tabindex', '-1');

// =====================================================================
// イベント
// =====================================================================
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    startMode(btn.dataset.mode);
    enterFullscreen(); // await なしで呼ぶ（非同期でOK）
  });
});

// --- ブロックするキー ---
const BLOCK_WITH_CTRL = new Set([
  'w','t','n','r','l','u','p','s','a','f','g','h','j','k','d',
  'Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
  '1','2','3','4','5','6','7','8','9','0','+','-',
]);

// --- ESC カウンター（5回） ---
const ESC_REQUIRED = 5;
const escDots = [...document.querySelectorAll('#esc-indicator span')];
let escHideTimer = null;

function updateEscIndicator() {
  escDots.forEach((d,i) => {
    d.style.background = i < escCount ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.25)';
  });
  const ind = document.getElementById('esc-indicator');
  if (escCount > 0) {
    ind.style.display = 'flex';
  } else {
    ind.style.display = 'none';
  }
  clearTimeout(escHideTimer);
  if (escCount > 0) {
    escHideTimer = setTimeout(() => { escCount = 0; updateEscIndicator(); }, 2500);
  }
}

document.addEventListener('keydown', e => {
  // 終了確認中：y → もどる、n → つづける
  if (document.getElementById('exit-confirm').classList.contains('show')) {
    e.preventDefault();
    if (e.key === 'y' || e.key === 'Y') { document.getElementById('btn-yes').click(); }
    if (e.key === 'n' || e.key === 'N') { document.getElementById('btn-no').click();  }
    return;
  }

  if (!currentMode) return;

  // --- ESC：5回連打で終了確認 ---
  if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    escCount++;
    updateEscIndicator();
    if (escCount >= ESC_REQUIRED) {
      escCount = 0;
      updateEscIndicator();
      showExitConfirm();
    }
    return;
  }

  // --- ブラウザ・OS ショートカットをブロック ---
  // Ctrl / Meta（Command・Windows）との組み合わせ
  if ((e.ctrlKey || e.metaKey) && BLOCK_WITH_CTRL.has(e.key.toLowerCase())) {
    e.preventDefault(); e.stopPropagation(); return;
  }
  // Alt+F4, Alt+Left, Alt+Right
  if (e.altKey) { e.preventDefault(); e.stopPropagation(); return; }
  // Fキー単体
  if (/^F\d{1,2}$/.test(e.key)) { e.preventDefault(); e.stopPropagation(); return; }

  // --- 通常キー → 絵文字スポーン ---
  // Ctrl/Meta/Alt 修飾なしのキーのみ反応
  if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    const x = 80 + Math.random() * (window.innerWidth  - 160);
    const y = 80 + Math.random() * (window.innerHeight - 160);
    spawnEmoji(x, y);
  }

}, true); // capture phase

document.addEventListener('mousedown', e => {
  if (!currentMode) return;
  if (document.getElementById('exit-confirm').classList.contains('show')) return;
  spawnEmoji(e.clientX, e.clientY);
});
document.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!currentMode) return;
  if (document.getElementById('exit-confirm').classList.contains('show')) return;
  Array.from(e.changedTouches).forEach(t => spawnEmoji(t.clientX, t.clientY));
}, {passive:false});

function showExitConfirm() {
  document.getElementById('exit-confirm').classList.add('show');
}
document.getElementById('btn-yes').addEventListener('click', () => {
  document.getElementById('exit-confirm').classList.remove('show');
  document.getElementById('play-screen').style.display = 'none';
  document.getElementById('mode-screen').style.display = 'flex';
  document.querySelectorAll('#play-screen div').forEach(el => {
    if (el.style.animation) el.remove();
  });
  // bgParticles 削除済み
  currentMode = null;
  escCount = 0;
  updateEscIndicator();
  exitFullscreen();
});
document.getElementById('btn-no').addEventListener('click', () => {
  document.getElementById('exit-confirm').classList.remove('show');
  escCount = 0;
  updateEscIndicator();
});
</script>
</body>
</html>
